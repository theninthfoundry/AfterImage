<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afterimage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#fff;--ink:#0a0a0a;--mu:#8a8a8a;--ln:#ebebeb;--sf:#f3f3f3;--ok:#1a9d4f;--bad:#e5382c;--wn:#c77d0a;--s1:8px;--s2:16px;--s3:24px;--s4:48px;--s5:96px;--t0:12px;--t1:16px;--t3:clamp(38px,8vw,68px);--sans:"Inter Tight",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t1)/1.5 var(--sans);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
main{max-width:760px;margin:0 auto;padding:0 var(--s3) var(--s5)}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:var(--s3) 0 var(--s4)}
header b{font-weight:600;letter-spacing:-.03em;padding-bottom:12px}
.mono{font:400 var(--t0)/1.5 var(--mono);letter-spacing:0}.dim{color:var(--mu)}
.seg{position:relative;display:grid;grid-template-columns:repeat(4,74px);overflow-x:auto}
.seg i{position:absolute;bottom:0;left:0;width:25%;height:2px;background:var(--ink);transition:transform .45s cubic-bezier(.7,0,.2,1)}
.seg button{background:none;border:0;padding:0 0 12px;font:400 13px var(--sans);color:var(--mu);cursor:pointer;text-align:left;transition:color .3s}
.seg button[aria-selected=true]{color:var(--ink);font-weight:600}
h1{font:600 var(--t3)/1.05 var(--sans);letter-spacing:-.05em;margin:var(--s2) 0 0}
h3{font:400 var(--t0) var(--mono);color:var(--mu);margin:0 0 var(--s1)}
p{margin:0}
.row{display:flex;justify-content:space-between;gap:var(--s2)}
.gap{margin-top:var(--s3);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s3)}
.chip{background:none;border:1px solid var(--ln);padding:8px 14px;font:500 13px var(--sans);cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:6px}
.chip[aria-current=true]{border-color:var(--ink)}
.chip b{width:6px;height:6px;border-radius:50%;background:var(--ln)}
.chip.done b{background:var(--ok)}
.pill{background:var(--ink);color:var(--bg);border:0;padding:14px 24px;font:600 14px var(--sans);letter-spacing:-.01em;cursor:pointer;transition:transform .2s}
.pill:hover:not(:disabled){transform:translateY(-2px)}
.ghost{background:none;border:0;padding:0;font:400 14px var(--sans);color:var(--mu);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.ghost:hover{color:var(--ink)}
button:disabled{opacity:.3;cursor:default}button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.rail{margin-top:var(--s3);display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.blk{margin-top:var(--s4)}
.rw{width:100%;text-align:left;background:none;border:0;display:grid;grid-template-columns:88px 1fr auto;gap:var(--s2);padding:12px 0;border-top:1px solid var(--ln);align-items:baseline;color:inherit;font:inherit;cursor:pointer}
.rw.m{grid-template-columns:88px 1fr;cursor:default}
.detail{grid-column:1/-1;margin-top:8px;padding:12px;background:var(--sf);font:13px/1.5 var(--sans)}
.detail .chip2{display:inline-block;border:1px solid var(--ln);padding:0 6px;margin:6px 4px 0 0;font:11px var(--mono);color:var(--mu)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;background:var(--bad)}.dot.live{animation:pl 1.4s infinite}.dot.ok{background:var(--ok)}.dot.off{background:var(--wn)}
@keyframes pl{50%{opacity:.25}}
.in{animation:up .5s cubic-bezier(.2,.7,.2,1) both}.swap{animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.br{display:grid;grid-template-columns:72px 1fr auto;gap:var(--s2);align-items:center;padding:14px 0;border-top:1px solid var(--ln)}
.tr i{display:block;height:4px;background:var(--mu)}.tr i.k{background:var(--ink);margin-top:3px}
.warn{border:1px solid var(--wn);color:var(--wn);padding:14px 16px;font:14px var(--sans);margin-bottom:var(--s3)}
.warn b{font-family:var(--mono);font-weight:500}
footer{margin-top:var(--s5);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.spin{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);animation:pl 1s infinite}
.run-line{display:grid;grid-template-columns:auto 78px 1fr auto;gap:var(--s2);padding:10px 0;border-top:1px solid var(--ln);align-items:baseline;font-size:13px}
svg.graph{width:100%;height:auto;margin-top:var(--s3);font-family:var(--sans)}
svg.graph text{font-size:10.5px;fill:var(--ink)}
svg.graph rect{fill:var(--bg);stroke:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main>
<header><b>Afterimage</b><div id="bar"></div></header>
<div id="app"></div>
<footer class="mono dim"><span id="fst">connecting…</span><button class="ghost" onclick="reset()">reset memory</button></footer>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
async function api(path,opt){const r=await fetch(path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j}
let health=null,tab="inc",busy=false,V={},B=null,G=null,RUNS=null,seen=new Set(),fatal=null,openRec=new Set(),ranOnce=new Set(),INCS=[];
const fx=k=>seen.has(k)?"":(seen.add(k),"in");
function stageLine(s,recalled){
 if(s.stage==="recall")return s.ok?(s.headline.startsWith("No")?"No memory yet.":`${recalled.length} ${recalled.length===1?"memory":"memories"} recalled.`):"Memory engine offline.";
 if(s.stage==="reason")return"Hypotheses re-ranked.";
 if(s.stage==="reflect")return"Deciding what to keep.";
 return s.headline}
async function boot(){try{health=await api("/api/health")}catch(e){health={memory:"offline",detail:String(e.message||e)}}
 try{INCS=(await api("/api/incidents")).incidents}catch(e){INCS=[]}
 $("#fst").textContent=health.memory==="online"?`Hindsight connected${health.llm?" · LLM on":" · LLM off, templated lessons"}`:`Hindsight not reachable — ${health.detail||"set HINDSIGHT_URL and HINDSIGHT_API_KEY"}`;
 render()}
async function run(n){if(busy)return;busy=true;V={steps:[],recalled:[],status:"live"};openRec.clear();tab="inc";render();
 try{const r=await api(`/api/incidents/${n}/run`,{method:"POST"});
  V={data:r,steps:[],recalled:[],status:"live"};render();
  for(const s of r.steps){await new Promise(res=>setTimeout(res,RM?0:550));V.steps.push(s);if(s.stage==="recall")V.recalled=r.recalled;render()}
  V.status="resolved";ranOnce.add(n);RUNS=null
 }catch(e){fatal=String(e.message||e)}
 busy=false;render()}
async function demo(){if(busy)return;await reset(true);await run(1);await new Promise(r=>setTimeout(r,900));await run(2)}
async function reset(silent){if(busy&&!silent)return;try{await api("/api/reset",{method:"POST"})}catch(e){}V={};seen.clear();openRec.clear();B=null;if(!silent)render()}
function setTab(t){tab=t;const a=$("#app");a.classList.remove("swap");void a.offsetWidth;a.classList.add("swap");
 if(t==="bm"&&!B)loadBm();if(t==="mem")loadMem();if(t==="graph"&&!G)loadGraph();render()}
async function loadBm(){try{B=await api("/api/benchmark",{method:"POST"})}catch(e){B={error:String(e.message||e)}}render()}
async function loadGraph(){try{[G,RUNS]=await Promise.all([api("/api/graph"),api("/api/runs")])}catch(e){G={error:String(e.message||e)}}render()}
function render(){
 const T=[["inc","Run"],["mem","Memory"],["graph","Graph"],["bm","Results"]],ix=T.findIndex(x=>x[0]===tab);
 $("#bar").innerHTML=`<div class="seg" role="tablist"><i style="transform:translateX(${ix*100}%)"></i>${T.map(x=>`<button role="tab" aria-selected="${x[0]===tab}" onclick="setTab('${x[0]}')">${x[1]}</button>`).join("")}</div>`;
 $("#app").innerHTML=tab==="bm"?bmV():tab==="mem"?memV():tab==="graph"?graphV():incV()}
function offlineNotice(){return health&&health.memory!=="online"?`<div class="warn in">Hindsight isn't reachable, so a run shows what happens with memory unavailable rather than a working recall. Set <b>HINDSIGHT_URL</b> and <b>HINDSIGHT_API_KEY</b> (see .env.example) and reload.</div>`:""}
function picker(){return`<div class="chips">${INCS.map(i=>`<button class="chip ${ranOnce.has(i.n)?"done":""}" aria-current="${V.data&&V.data.inc.id===i.id}" onclick="run(${i.n})" ${busy?"disabled":""}><b></b>${i.id}</button>`).join("")}</div>`}
function incV(){
 if(fatal)return`${offlineNotice()}<section class="in"><h1>Something broke.</h1><p class="mono dim" style="margin-top:8px">${esc(fatal)}</p></section>`;
 const v=V,r=v.data;
 const act=`<div class="gap"><button class="ghost" onclick="demo()" ${busy?"disabled":""}>play the demo (INC-001 → INC-002)</button></div>`;
 if(!r)return`${offlineNotice()}<section class="in"><h1>Every incident teaches the next one.</h1>${picker()}${act}</section>`;
 const inc=r.inc,n=v.steps.length,s=v.steps[n-1],p=n,tot=r.steps.length,ok=v.status==="resolved",
 hd=!s?"Incident detected.":stageLine(s,v.recalled),
 recl=v.steps.some(x=>x.stage==="recall")&&v.recalled.length,
 ord=recl?`<div class="blk ${fx(inc.id+"o")}"><h3>investigation order</h3><p class="dim">${r.base_order.join(" → ")}</p><p style="font-weight:600">${r.order.join(" → ")}</p></div>`:"",
 rc=recl?`<div class="blk ${fx(inc.id+"r")}"><h3>recalled</h3>${v.recalled.map(m=>{
   const isOpen=openRec.has(m.id),what=m.hyp?((m.result==="false"?"skip ":m.result==="partial"?"doubt ":"try ")+m.hyp):"past fix";
   return`<button class="rw" onclick="toggleRec('${m.id}')"><span class="mono">${esc(m.id)}</span><span>${esc(what)}</span><span class="mono dim">${m.relevance==null?"—":Math.round(m.relevance*100)+"%"}</span>${isOpen?`<div class="detail">${esc(m.text)}${(m.matched||[]).map(s=>`<span class="chip2">${esc(s)}</span>`).join("")}</div>`:""}</button>`}).join("")}</div>`:"";
 const memline=r.memory.status==="offline"?`<span class="dot off"></span>memory offline, nothing saved`:r.memory.written?`<span class="dot ok"></span>${r.memory.written} saved to Hindsight`:"";
 return`${offlineNotice()}<section><div class="row mono dim"><span>${esc(inc.id)} · ${esc(inc.service)} · ${esc(inc.severity)}</span><span><i class="dot ${ok?"ok":"live"}"></i>${ok?"resolved":"live"}</span></div><p class="mono dim" style="margin-top:8px">${inc.metrics.map(x=>x[0].toLowerCase()+" "+esc(x[1])).join(" · ")}</p><h1 class="${fx(inc.id+"h"+n)}">${esc(hd)}</h1>
 <div class="rail mono">${busy&&n<tot?'<span class="spin" aria-hidden="true"></span>':''}<span>[${"█".repeat(p)}${"░".repeat(Math.max(0,tot-p))}]</span><span class="dim">${s?s.stage:""}</span>${ok?`<span class="dim">· ${r.sec}s simulated, ${r.wrong} wrong · ${memline}</span>`:""}</div>
 ${picker()}${act}${ord}${rc}</section>`}
function toggleRec(id){openRec.has(id)?openRec.delete(id):openRec.add(id);render()}
function memV(){
 if(!health||health.memory!=="online")return`${offlineNotice()}<section class="in"><h1>No memory to show.</h1><p class="mono dim" style="margin-top:8px">Connect Hindsight to see stored incidents and patterns.</p></section>`;
 return`<section class="in"><p class="mono dim">memory · live from Hindsight</p><div id="mm"><p class="dim">loading…</p></div></section>`}
async function loadMem(){if(!health||health.memory!=="online")return;try{const r=await api("/api/memory");const el=$("#mm");if(!el)return;
 el.innerHTML=r.items.length?r.items.map(m=>`<div class="rw m"><span class="mono">${esc(m.id.slice(0,8))}<br><span class="dim">${esc(m.type)}</span></span><span>${esc(m.text)}</span></div>`).join(""):'<p class="dim">Empty. Run an incident first.</p>'
}catch(e){}}
function graphV(){
 if(!G)return`<section class="in"><h1>…</h1><p class="mono dim" style="margin-top:8px">loading the audit trail</p></section>`;
 if(G.error)return`<section class="in"><h1>Couldn't load.</h1><p class="mono dim" style="margin-top:8px">${esc(G.error)}</p></section>`;
 const runs=(RUNS&&RUNS.runs)||[];
 const tl=runs.length?runs.map(r=>`<div class="run-line"><span class="dot ${r.memory_status==="online"?"ok":r.memory_status==="offline"?"off":""}" style="margin:0"></span><span class="mono dim">${esc(r.started_at.slice(11,19))}</span><span>${esc(r.incident)} · ${esc(r.root_cause)}</span><span class="mono dim">${r.diagnosis_sec}s · ${r.wrong} wrong</span></div>`).join(""):'<p class="dim">No runs recorded yet.</p>';
 return`<section class="in"><h1>${runs.length}</h1><p class="mono dim" style="margin-top:8px">runs recorded in the structured audit trail — independent of Hindsight, so this works even offline</p>
 <div class="blk"><h3>timeline</h3>${tl}</div>
 <div class="blk"><h3>memory graph</h3>${svgGraph(G)}</div></section>`}
function svgGraph(g){
 if(!g.nodes.length)return'<p class="dim">Run an incident to populate the graph.</p>';
 const rows={service:0,incident:1,root_cause:2,resolution:3},byRow={0:[],1:[],2:[],3:[]};
 g.nodes.forEach(n=>byRow[rows[n.kind]].push(n));
 const cellW=150,cellH=64,pad=70,pos={},maxCols=Math.max(1,...Object.values(byRow).map(a=>a.length));
 const W=maxCols*cellW+pad,H=4*cellH+pad;
 Object.entries(byRow).forEach(([row,arr])=>arr.forEach((n,i)=>{pos[n.id]={x:pad/2+i*cellW+cellW/2,y:+row*cellH+cellH/2+20}}));
 const styles={affected:'stroke="var(--ln)" stroke-width="1"',caused_by:'stroke="var(--ink)" stroke-width="1.2"',resolved_by:'stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3,3"',similar_to:'stroke="var(--ink)" stroke-width="1" stroke-dasharray="1,4"'};
 const edges=g.edges.map(e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return"";
   if(e.rel==="similar_to"){const my=Math.min(a.y,b.y)-26;return`<path d="M${a.x},${a.y} Q${(a.x+b.x)/2},${my} ${b.x},${b.y}" fill="none" ${styles[e.rel]}/>`}
   return`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${styles[e.rel]}/>`}).join("");
 const nodes=g.nodes.map(n=>{const p=pos[n.id],label=n.label.length>16?n.label.slice(0,15)+"…":n.label;
   return`<g><rect x="${p.x-65}" y="${p.y-14}" width="130" height="28"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle">${esc(label)}</text><title>${esc(n.label)} (${n.kind})</title></g>`}).join("");
 return`<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="memory graph">${edges}${nodes}</svg>`}
function bmV(){
 if(!B)return`${offlineNotice()}<section class="in"><h1>…</h1><p class="mono dim" style="margin-top:8px">running three incidents twice</p></section>`;
 if(B.error)return`${offlineNotice()}<section class="in"><h1>Benchmark failed.</h1><p class="mono dim" style="margin-top:8px">${esc(B.error)}</p></section>`;
 const mx=Math.max(...B.without.concat(B.with).map(r=>r.sec)),ta=B.without.reduce((s,r)=>s+r.sec,0),tb=B.with.reduce((s,r)=>s+r.sec,0);
 return`<section class="in"><h1>${ta}s → ${tb}s</h1><p class="mono dim" style="margin-top:8px">deployment-regression family (INC-001–003), without → with real Hindsight recall, simulated seconds</p><div class="blk">${B.without.map((r,n)=>`<div class="br"><span class="mono">${esc(r.id)}</span><div class="tr"><i style="width:${r.sec/mx*100}%"></i><i class="k" style="width:${B.with[n].sec/mx*100}%"></i></div><span class="mono">${r.sec} → ${B.with[n].sec}</span></div>`).join("")}</div></section>`}
boot();
</script></body></html>
